name: Host checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - run: make check
  native-linux:
    runs-on: ubuntu-24.04
    env:
      LLVM_CONFIG: /usr/bin/llvm-config-19
    outputs:
      release-tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: .cache
          key: nuvio-linux-llvm19-${{ hashFiles('deps.lock', 'scripts/build.py') }}
      - name: Install native host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19-dev lld-19 nasm zlib1g-dev pkg-config
      - run: make build
      - name: Package exact test candidate
        id: package
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tag="v$(cat VERSION)"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            tag="pr-${PR_NUMBER}-${GITHUB_SHA:0:12}"
          fi
          python3 scripts/package_release.py --repo "$GITHUB_REPOSITORY" --tag "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Upload experimental test packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuvio-experimental-${{ github.sha }}
          path: |
            release/*.zip
            release/*.elf
            release/payloads.json
            release/SHA256SUMS
            release/ASSETS
          if-no-files-found: error
          retention-days: 14
      - name: Save verified build inputs
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: nuvio-linux-llvm19-${{ hashFiles('deps.lock', 'scripts/build.py') }}
  pr-release:
    name: Publish experimental PR release
    needs: [check, native-linux]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the tested packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nuvio-experimental-${{ github.sha }}
          path: release
      - name: Verify release assets
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish fixed-commit prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.native-linux.outputs.release-tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preserving existing release $TAG and its original assets."
            exit 0
          fi
          cat > notes.md <<EOF
          Experimental test build for PR #${PR_NUMBER}. Not console-validated. Do not update firmware.

          PR head: ${HEAD_SHA}
          Tested merge commit: ${GITHUB_SHA}

          Download PPSA99996.zip for installation, and SHA256SUMS to verify it.
          The complete nuvio-ps5 package includes source and build receipts.
          Keep your working installation and /data/nuvio settings. Close Nuvio before replacing its app folder.

          Host checks and native compilation passed. This does not establish real PS5 controller or playback behavior.
          EOF
          mapfile -t assets < release/ASSETS
          gh release create "$TAG" "${assets[@]}" --repo "$GH_REPO" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "PR #${PR_NUMBER} test build (${GITHUB_SHA:0:12})" --notes-file notes.md
          echo "### Experimental download" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
