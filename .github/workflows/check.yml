name: Host checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - run: make check
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.diff.outputs.native == 'true' && steps.verified.outputs.cache-hit != 'true' }}
      verification-key: ${{ steps.diff.outputs.verification-key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Detect application changes
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import hashlib, os, subprocess
          base = os.environ['BASE']
          exists = subprocess.run(['git', 'cat-file', '-e', base + '^{commit}'], capture_output=True).returncode == 0
          native = True
          if exists:
              paths = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, os.environ['GITHUB_SHA']]).split(b'\0')
              native = any(path and not path.endswith(b'.md') for path in paths)
          entries = subprocess.check_output(['git', 'ls-tree', '-rz', os.environ['GITHUB_SHA']]).split(b'\0')
          code = b'\0'.join(entry for entry in entries if entry and not entry.split(b'\t', 1)[1].endswith(b'.md'))
          key = 'nuvio-verified-linux19-v1-' + hashlib.sha256(code).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('native=' + str(native).lower() + '\n')
              output.write('verification-key=' + key + '\n')
          PY
      - name: Look up successful build of the same code
        id: verified
        if: steps.diff.outputs.native == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/verified/${{ steps.diff.outputs.verification-key }}
          key: ${{ steps.diff.outputs.verification-key }}
          lookup-only: true
  native-build:
    needs: [check, changes]
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build.yml
    with:
      run-checks: false
      verification-key: ${{ needs.changes.outputs.verification-key }}
  native-linux:
    needs: [check, changes, native-build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require a successful build or verified skip
        env:
          CHECK: ${{ needs.check.result }}
          CHANGES: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
          BUILD: ${{ needs.native-build.result }}
        run: |
          [[ "$CHECK" == success && "$CHANGES" == success ]] || exit 1
          if [[ "$NATIVE" == true ]]; then
            [[ "$BUILD" == success ]] || exit 1
            echo 'Native build and packaging passed.'
          else
            echo 'Documentation-only change or previously verified identical code; no new package.'
          fi
  pr-release:
    name: Publish experimental PR release
    needs: [native-linux, native-build]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the tested packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.native-build.outputs.artifact-name }}
          path: release
      - name: Verify release assets
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish fixed-commit prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.native-build.outputs.release-tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preserving existing release $TAG and its original assets."
            exit 0
          fi
          cat > notes.md <<EOF
          Experimental test build for PR #${PR_NUMBER}. Not console-validated. Do not update firmware.

          PR head: ${HEAD_SHA}
          Tested merge commit: ${GITHUB_SHA}

          Download PPSA99996.zip for installation, and SHA256SUMS to verify it.
          The complete nuvio-pro-ps5 package includes source and build receipts.
          Keep your working installation and /data/nuvio settings. Close Nuvio Pro before replacing its app folder.

          Host checks and native compilation passed. This does not establish real PS5 controller or playback behavior.
          EOF
          mapfile -t assets < release/ASSETS
          gh release create "$TAG" "${assets[@]}" --repo "$GH_REPO" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "PR #${PR_NUMBER} test build (${GITHUB_SHA:0:12})" --notes-file notes.md
          echo "### Experimental download" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
