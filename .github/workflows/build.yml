name: Build package
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-24.04
      run-checks:
        type: boolean
        default: true
      verification-key:
        type: string
        default: ''
    outputs:
      release-tag:
        value: ${{ jobs.build.outputs.release-tag }}
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      release-tag: ${{ steps.package.outputs.tag }}
      artifact-name: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: deps.lock
      - name: Install Linux host tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19-dev lld-19 nasm zlib1g-dev pkg-config
          echo 'LLVM_CONFIG=/usr/bin/llvm-config-19' >> "$GITHUB_ENV"
      - name: Install macOS host tools
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld coreutils grep nasm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix grep)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "LLVM_CONFIG=$(brew --prefix llvm)/bin/llvm-config" >> "$GITHUB_ENV"
      - name: Identify compiled dependency cache
        id: ffmpeg-key
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, subprocess, sys
          sys.path.insert(0, 'scripts')
          from build import ffmpeg_cache_id
          compiler = subprocess.check_output([os.environ['LLVM_CONFIG'], '--version'], text=True).strip()
          print('id=' + ffmpeg_cache_id(compiler))
          PY
      - name: Restore downloaded archives
        id: downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/*.zip
            .cache/*.tar.gz
            .cache/*.tar.xz
            .cache/*.wgt
          key: nuvio-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps.lock') }}
      - name: Restore compiled FFmpeg
        id: ffmpeg
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/ffmpeg-${{ steps.ffmpeg-key.outputs.id }}
          key: nuvio-ffmpeg-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg-key.outputs.id }}
      - name: Check
        if: inputs.run-checks
        run: make check
      - name: Build
        run: make build
      - name: Package exact candidate
        id: package
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tag="manual-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            tag="pr-${PR_NUMBER}-${GITHUB_SHA:0:12}"
          fi
          python3 scripts/package_release.py --repo "$GITHUB_REPOSITORY" --tag "$tag"
          (cd release && shasum -a 256 --check SHA256SUMS)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "artifact=nuvio-${RUNNER_OS}-${RUNNER_ARCH}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Upload verified packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            release/*.zip
            release/*.elf
            release/payloads.json
            release/SHA256SUMS
            release/ASSETS
          if-no-files-found: error
          retention-days: 14
      - name: Save downloaded archives
        if: success() && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/*.zip
            .cache/*.tar.gz
            .cache/*.tar.xz
            .cache/*.wgt
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Save compiled FFmpeg
        if: success() && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/ffmpeg-${{ steps.ffmpeg-key.outputs.id }}
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      - name: Record successful code verification
        if: inputs.verification-key != ''
        env:
          VERIFICATION_KEY: ${{ inputs.verification-key }}
        run: |
          mkdir -p .cache/verified
          printf '%s\n' "$GITHUB_SHA" > ".cache/verified/$VERIFICATION_KEY"
      - name: Cache successful code verification
        if: inputs.verification-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/verified/${{ inputs.verification-key }}
          key: ${{ inputs.verification-key }}
