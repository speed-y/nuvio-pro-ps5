name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      macos:
        description: Also check macOS build compatibility
        type: boolean
        default: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    uses: ./.github/workflows/build.yml
    with:
      runner: macos-14
  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested Linux packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: release
      - name: Verify release assets
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.release-tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preserving existing release $TAG and its original assets."
            exit 0
          fi
          args=(--draft --title "Nuvio PS5 ${TAG}" --generate-notes --target "$GITHUB_SHA")
          case "$TAG" in *alpha*|*beta*|*rc*) args+=(--prerelease) ;; esac
          mapfile -t assets < release/ASSETS
          gh release create "$TAG" "${args[@]}" "${assets[@]}"
