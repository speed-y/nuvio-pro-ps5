changelog:
  exclude:
    authors:
      - github-actions[bot]
  categories:
    - title: Features & UI
      labels:
        - enhancement
        - feature
        - ui
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: PS5 & Playback
      labels:
        - ps5
        - playback
        - controller
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Maintenance
      labels:
        - chore
        - dependencies
        - ci
    - title: Other Changes
      labels:
        - "*"
